name: Docker Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: shreyp135/alethea
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/alethea

  CLOUD_RUN_SERVICE: alethea-api
  CLOUD_RUN_REGION: us-central1

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          echo "image=docker.io/${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            docker.io/${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}

      # Optional verification step
      - name: Verify image contains latest code
        run: |
          docker pull docker.io/${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}
          docker run --rm \
            docker.io/${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }} \
            sh -c "grep -R 'GROQ' src || true"


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image docker.io/${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }} \
            --region ${{ env.CLOUD_RUN_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=1
